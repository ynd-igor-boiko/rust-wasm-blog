[workspace]
resolver = "2"
members = [
    "blog-server",
    "blog-client",
    "blog-cli",
    "blog-wasm",
]

[workspace.dependencies]
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prost = "0.13"
prost-types = "0.13"
tonic = "0.12"
tonic-build = "0.12"
